name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SofiesUnivers.slnx

      - name: Build
        run: dotnet build SofiesUnivers.slnx -c Release --no-restore

      - name: Unit and integration tests
        run: dotnet test SofiesUnivers.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish app
        run: dotnet publish src/SofiesUnivers.App -c Release -o artifacts/publish

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser tests (Chromium, iPhone-sized)
        working-directory: tests/e2e
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
